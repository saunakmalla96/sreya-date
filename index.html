<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sreya — You and Me?</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;
  font-family:Arial,Helvetica,sans-serif;color:#26352b;overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,181,194,.8),transparent 25%),
    radial-gradient(circle at 92% 88%,rgba(177,210,177,.8),transparent 28%),
    linear-gradient(135deg,#fffdf7,#f1f7ef 52%,#fff0f4);
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px);opacity:.55
}
body:before{width:220px;height:220px;background:#ffbdc7;top:-105px;right:-70px}
body:after{width:280px;height:280px;background:#b7d2b6;bottom:-145px;left:-105px}

.card{
  width:min(720px,100%);position:relative;text-align:center;
  padding:45px 25px 32px;border-radius:36px;
  background:rgba(255,255,255,.79);backdrop-filter:blur(17px);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 30px 90px rgba(49,65,54,.17);
  animation:cardIn .8s cubic-bezier(.2,.9,.2,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:none}}

.floating{
  position:absolute;pointer-events:none;opacity:.7;
  animation:float 4s ease-in-out infinite;
}
.f1{top:9%;left:9%;font-size:23px;color:#b04f68}
.f2{top:18%;right:10%;font-size:17px;color:#658066;animation-delay:.8s}
.f3{bottom:17%;left:8%;font-size:19px;color:#d47b88;animation-delay:1.6s}
.f4{bottom:10%;right:9%;font-size:24px;color:#658066;animation-delay:2.4s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-13px) rotate(8deg)}}

.name{
  font-family:Georgia,serif;font-size:clamp(52px,13vw,88px);
  line-height:.88;margin:0;color:#49634f;
  animation:namePop .9s .15s both cubic-bezier(.2,1.4,.4,1);
}
@keyframes namePop{from{opacity:0;transform:scale(.6) rotate(-5deg)}to{opacity:1;transform:none}}

.drink{
  display:inline-block;font-family:Georgia,serif;font-size:clamp(22px,5vw,32px);
  color:#b04f68;margin:22px 0 8px;
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{50%{transform:translateY(-4px) rotate(1deg)}}

.question{
  font-family:Georgia,serif;font-size:clamp(31px,8vw,52px);
  font-weight:700;margin:8px 0 14px;color:#29372d;
}
.sub{font-size:16px;line-height:1.65;color:#707970;margin:0 auto 27px}
.sub em{color:#b04f68}

.actions{
  min-height:68px;display:flex;justify-content:center;align-items:center;
  gap:13px;position:relative;flex-wrap:wrap;
}
button{
  border:0;border-radius:999px;padding:14px 25px;min-height:51px;
  font-size:15px;font-weight:800;cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,filter .18s ease;
}
button:hover{transform:translateY(-4px) scale(1.03)}
#yes{
  background:#49634f;color:#fff;
  box-shadow:0 13px 28px rgba(73,99,79,.28);
  animation:yesPulse 2.1s infinite;
}
@keyframes yesPulse{0%,100%{box-shadow:0 13px 28px rgba(73,99,79,.25)}50%{box-shadow:0 15px 34px rgba(73,99,79,.4)}}
#no{background:#fff;color:#b04f68;border:1px solid #edc6ce}
#tease{min-height:25px;margin-top:11px;font-size:13px;color:#8d6570}

.hidden{display:none!important}
.plan{
  margin-top:27px;padding-top:25px;border-top:1px solid rgba(73,99,79,.14);
  text-align:left;animation:slideUp .55s ease both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.plan h2{
  text-align:center;font-family:Georgia,serif;font-size:31px;
  margin:0 0 7px;color:#49634f
}
.plan p{text-align:center;color:#6d766e;margin:0 0 19px}
label{display:block;font-size:13px;font-weight:800;margin:15px 0 7px;color:#56705a}
input{
  width:100%;padding:14px;border:1px solid #d6dfd5;border-radius:14px;
  background:#fff;font:inherit;color:#26352b;outline:none;
}
input:focus{border-color:#9bb79b;box-shadow:0 0 0 4px rgba(155,183,155,.18)}
.submit{
  width:100%;margin-top:20px;background:#b04f68;color:white;
  box-shadow:0 12px 25px rgba(176,79,104,.22);
}
.submit:hover{filter:brightness(1.05)}
.status{text-align:center;margin-top:18px;font-weight:800;color:#49634f;line-height:1.6}
.status .big{font-family:Georgia,serif;font-size:26px}
.note{font-size:11px;color:#96988f;margin-top:23px}

.confetti{
  position:fixed;top:-20px;z-index:30;pointer-events:none;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}
}
@media(max-width:520px){
  .card{padding:40px 18px 29px;border-radius:28px}
  .floating{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="card">
  <div class="floating f1">✦</div>
  <div class="floating f2">🍓</div>
  <div class="floating f3">✦</div>
  <div class="floating f4">🍵</div>

  <h1 class="name">Sreya</h1>
  <div class="drink">🍓 Strawberry Matcha 🍵</div>
  <div class="question">You and me?</div>
  <p class="sub">One question. No Pressure<br><em>(okay, maybe a little pressure😉)</em></p>

  <div class="actions" id="actions">
    <button id="yes" type="button">Yes, obviously ❤️</button>
    <button id="no" type="button">No</button>
  </div>
  <div id="tease" aria-live="polite"></div>

  <section id="plan" class="plan hidden">
    <h2>Okay, it's a date. 😌</h2>
    <p>Now you get to choose when.</p>
    <form id="dateForm">
      <label for="date">Which day?</label>
      <input id="date" type="date" required>
      <label for="time">What time?</label>
      <input id="time" type="time" required>
      <button class="submit" type="submit">Send my choice 💌</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
  <div class="note">Your choice goes straight to the date planner. ✨</div>
</main>

<script>
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbzH_sBHq9tHg1NZf3iuD5-hM0dePme20S34I1OibpsAKc_V-4_hqbSKUulfF90EJyAI/exec";
const no=document.getElementById("no"),yes=document.getElementById("yes"),tease=document.getElementById("tease"),actions=document.getElementById("actions"),plan=document.getElementById("plan"),form=document.getElementById("dateForm"),status=document.getElementById("status");
const messages=["Sure? 😏","Wait...","Think again 👀","Last chance...","Nice try 😂"];
let attempts=0;

function moveNo(){
  attempts++;
  no.textContent=messages[Math.min(attempts,messages.length)-1];
  const scale=Math.max(.45,1-attempts*.1);
  const x=(attempts%2?1:-1)*(28+attempts*14);
  const y=attempts%2?-8:8;
  no.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
  no.style.fontSize=Math.max(11,16-attempts)+"px";
  tease.textContent=attempts<messages.length?"Hmm... that button is getting suspiciously difficult to press. 😌":"Okay okay, I surrender. You can actually say no. 😂";
}
no.addEventListener("mouseenter",moveNo);
no.addEventListener("click",moveNo);

function confetti(){
  const symbols=["🍓","🍵","✦","♡","✨"];
  for(let i=0;i<28;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.fontSize=(12+Math.random()*15)+"px";
    el.style.animationDuration=(2.5+Math.random()*2)+"s";
    el.style.setProperty("--x",(Math.random()*240-120)+"px");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  }
}

yes.addEventListener("click",()=>{
  confetti();
  actions.classList.add("hidden");
  tease.textContent="Excellent decision. 🍓🍵";
  plan.classList.remove("hidden");
  plan.scrollIntoView({behavior:"smooth",block:"center"});
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const date=document.getElementById("date").value;
  const time=document.getElementById("time").value;
  if(!date||!time)return;
  status.textContent="Saving your choice... 💕";
  try{
    await fetch(SUBMIT_URL,{
      method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({name:"Sreya Shah",date,time})
    });
    status.innerHTML='<div class="big">It’s a date. 💕</div>'+date+" at "+time+"<br><br>Strawberry Matcha awaits. 🍓🍵";
    form.querySelector(".submit").disabled=true;
    confetti();
  }catch(err){
    status.textContent="Something went wrong. Please try submitting once more.";
  }
});
</script>
</body>
</html>
